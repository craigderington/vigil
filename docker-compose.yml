services:
  vigil:
    build: .
    ports: ["${VIGIL_HOST_PORT:-8080}:8080"]
    volumes: ["vigil-data:/data"]
    restart: unless-stopped
    secrets: [smtp_password]
    environment:
      VIGIL_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
volumes: { vigil-data: {} }
secrets:
  smtp_password:
    file: ./secrets/smtp_password
