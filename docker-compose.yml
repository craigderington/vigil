services:
  vigil:
    build: .
    ports: ["${VIGIL_HOST_PORT:-8080}:8080"]
    volumes: ["vigil-data:/data"]
    restart: unless-stopped
    secrets: [smtp_password]
    environment:
      VIGIL_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      VIGIL_BIND: ${VIGIL_BIND:-0.0.0.0:8080}
      VIGIL_MAX_CONCURRENCY: ${VIGIL_MAX_CONCURRENCY:-25}
volumes: { vigil-data: {} }
secrets:
  smtp_password:
    file: ./secrets/smtp_password
