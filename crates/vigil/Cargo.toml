[package]
name = "vigil"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
anyhow = "1"
async-trait = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.16"
webpki-roots = "1"
croner = "2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
